x-logging: &rotating-logs
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  dockerhub:
    image: ${MIRROR_CACHE_IMAGE:-registry:3.1.2}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      OTEL_TRACES_EXPORTER: none
      REGISTRY_PROXY_USERNAME: ${DOCKERHUB_USERNAME:-}
      REGISTRY_PROXY_PASSWORD: ${DOCKERHUB_PAT:-}
    volumes:
      - ./registry/dockerhub.yml:/etc/distribution/config.yml:ro
      - type: bind
        source: ${DOCKERHUB_CACHE_DIR:?Set DOCKERHUB_CACHE_DIR in .env}
        target: /var/lib/registry
        bind:
          create_host_path: false
    logging: *rotating-logs

  ghcr:
    image: ${MIRROR_CACHE_IMAGE:-registry:3.1.2}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:5000"
    environment:
      OTEL_TRACES_EXPORTER: none
    volumes:
      - ./registry/ghcr.yml:/etc/distribution/config.yml:ro
      - type: bind
        source: ${GHCR_CACHE_DIR:?Set GHCR_CACHE_DIR in .env}
        target: /var/lib/registry
        bind:
          create_host_path: false
    logging: *rotating-logs
