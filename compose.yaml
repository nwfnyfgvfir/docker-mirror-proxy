x-logging: &rotating-logs
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    image: ${MIRROR_GATEWAY_IMAGE:-docker-mirror-proxy:local}
    build:
      context: .
    pull_policy: ${MIRROR_GATEWAY_PULL_POLICY:-build}
    restart: unless-stopped
    depends_on:
      - dockerhub
      - ghcr
    ports:
      - "443:443"
    environment:
      MIRROR_DOMAIN: ${MIRROR_DOMAIN:?Set MIRROR_DOMAIN in .env}
      MIRROR_IP_RATE: ${MIRROR_IP_RATE:-10r/s}
      MIRROR_IP_BURST: ${MIRROR_IP_BURST:-20}
      MIRROR_IP_CONNECTIONS: ${MIRROR_IP_CONNECTIONS:-8}
      MIRROR_GLOBAL_RATE: ${MIRROR_GLOBAL_RATE:-100r/s}
      MIRROR_GLOBAL_BURST: ${MIRROR_GLOBAL_BURST:-100}
      MIRROR_GLOBAL_CONNECTIONS: ${MIRROR_GLOBAL_CONNECTIONS:-32}
      MIRROR_DOWNLOAD_RATE: ${MIRROR_DOWNLOAD_RATE:-2m}
    volumes:
      - type: bind
        source: ${MIRROR_TLS_DIR:?Set MIRROR_TLS_DIR in .env}
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
    logging: *rotating-logs

  dockerhub:
    image: registry:3.1.2
    restart: unless-stopped
    environment:
      OTEL_TRACES_EXPORTER: none
    volumes:
      - type: bind
        source: ${DOCKERHUB_CONFIG_FILE:-./registry/dockerhub.yml}
        target: /etc/distribution/config.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DOCKERHUB_CACHE_DIR:?Set DOCKERHUB_CACHE_DIR in .env}
        target: /var/lib/registry
        bind:
          create_host_path: false
    logging: *rotating-logs

  ghcr:
    image: registry:3.1.2
    restart: unless-stopped
    environment:
      OTEL_TRACES_EXPORTER: none
    volumes:
      - ./registry/ghcr.yml:/etc/distribution/config.yml:ro
      - type: bind
        source: ${GHCR_CACHE_DIR:?Set GHCR_CACHE_DIR in .env}
        target: /var/lib/registry
        bind:
          create_host_path: false
    logging: *rotating-logs
